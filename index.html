    <!-- Evita el parpadeo blanco al cargar en modo oscuro -->
    <script>
      try {
        var t = localStorage.getItem('sandy-theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
