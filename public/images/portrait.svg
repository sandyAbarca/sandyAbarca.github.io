<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ilustración de Sandy Abarca, fotógrafa, tomando una foto en la playa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2bb"/>
      <stop offset="1" stop-color="#f7e3a3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- marco tipo arco (océano) -->
  <path d="M210 680 L210 310 A190 190 0 0 1 590 310 L590 680 Z" fill="#0f3c65"/>

  <!-- olas -->
  <path d="M210 648 Q310 628 410 650 Q510 672 590 642 L590 680 L210 680 Z" fill="#4a9ccb" opacity="0.75"/>
  <path d="M210 662 Q310 682 410 660 Q510 640 590 668 L590 680 L210 680 Z" fill="#78c0e6" opacity="0.6"/>

  <!-- sol -->
  <g>
    <circle cx="512" cy="262" r="52" fill="#ffac1e"/>
    <g stroke="#ffac1e" stroke-width="8" stroke-linecap="round">
      <path d="M512 180 V 158"/>
      <path d="M512 344 V 366"/>
      <path d="M430 262 H 408"/>
      <path d="M594 262 H 616"/>
    </g>
  </g>

  <!-- cuerpo (camiseta cielo) -->
  <path d="M400 585 C340 585 300 645 268 725 L532 725 C500 645 460 585 400 585 Z" fill="#78c0e6"/>
  <path d="M384 590 L400 615 L416 590" fill="none" stroke="#4a9ccb" stroke-width="5" stroke-linecap="round"/>

  <!-- correa de la cámara -->
  <path d="M322 594 Q382 612 470 502" fill="none" stroke="#0b2c4a" stroke-width="13" stroke-linecap="round"/>

  <!-- cuello -->
  <rect x="380" y="525" width="40" height="62" fill="#e0a87b"/>

  <!-- cabello trasero -->
  <ellipse cx="400" cy="392" rx="146" ry="164" fill="#102f4c"/>
  <!-- rostro -->
  <ellipse cx="400" cy="408" rx="108" ry="128" fill="#e9b98e"/>
  <!-- cabello lateral -->
  <rect x="292" y="330" width="26" height="180" rx="13" fill="#102f4c"/>
  <rect x="482" y="330" width="26" height="180" rx="13" fill="#102f4c"/>
  <!-- sonrisa (asoma bajo la cámara) -->
  <path d="M376 528 Q400 546 424 528" fill="none" stroke="#b4784f" stroke-width="6" stroke-linecap="round"/>

  <!-- sombrero de paja -->
  <ellipse cx="400" cy="298" rx="182" ry="34" fill="#d99a3d"/>
  <path d="M270 296 Q268 208 400 202 Q532 208 530 296 Z" fill="#cf9134"/>
  <rect x="270" y="282" width="260" height="15" fill="#0f3c65"/>

  <!-- cámara -->
  <g>
    <rect x="298" y="392" width="204" height="116" rx="18" fill="#0b2c4a" stroke="#ffac1e" stroke-width="3.5"/>
    <rect x="352" y="377" width="96" height="26" rx="10" fill="#0b2c4a" stroke="#ffac1e" stroke-width="3.5"/>
    <circle cx="400" cy="450" r="55" fill="#ffac1e"/>
    <circle cx="400" cy="450" r="41" fill="#0f3c65"/>
    <circle cx="400" cy="450" r="24" fill="#102f4c"/>
    <circle cx="386" cy="437" r="9" fill="#fff2bb" opacity="0.85"/>
    <circle cx="332" cy="418" r="9" fill="#fff2bb"/>
    <rect x="468" y="414" width="20" height="72" rx="9" fill="#0b2c4a" stroke="#ffac1e" stroke-width="2.5"/>
  </g>

  <!-- manos -->
  <rect x="264" y="438" width="50" height="74" rx="23" fill="#e0a87b" transform="rotate(-10 289 475)"/>
  <rect x="486" y="438" width="50" height="74" rx="23" fill="#e0a87b" transform="rotate(10 511 475)"/>

  <!-- destellos -->
  <g fill="#e8930a" opacity="0.65">
    <path d="M150 188 L153 197 L162 200 L153 203 L150 212 L147 203 L138 200 L147 197 Z"/>
    <path d="M655 170 L658 179 L667 182 L658 185 L655 194 L652 185 L643 182 L652 179 Z"/>
    <path d="M142 782 L144.5 789 L152 791 L144.5 793.5 L142 801 L139.5 793.5 L132 791 L139.5 789 Z"/>
  </g>

  <!-- firma -->
  <text x="400" y="845" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="58" fill="#0f3c65" text-anchor="middle">Sandy Abarca</text>
  <text x="400" y="895" font-family="Arial, sans-serif" font-size="15" letter-spacing="5" fill="#5b7a99" text-anchor="middle">FOTÓGRAFA · RETRATO DE EJEMPLO</text>
</svg>
