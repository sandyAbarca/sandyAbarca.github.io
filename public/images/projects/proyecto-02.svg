    <rect x="150" y="600" width="240" height="36" rx="18" fill="#ffac1e"/>
  </g>

  <!-- panel 2 -->
  <g transform="rotate(2 600 400)">
    <rect x="450" y="110" width="300" height="580" rx="14" fill="#fff2bb" stroke="#fffce9" stroke-width="4"/>
    <circle cx="600" cy="230" r="42" fill="#4a9ccb"/>
    <rect x="555" y="285" width="90" height="160" rx="44" fill="#0f3c65"/>
    <rect x="575" y="445" width="22" height="150" rx="11" fill="#4a9ccb"/>
