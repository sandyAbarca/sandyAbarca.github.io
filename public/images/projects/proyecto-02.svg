  </g>

  <!-- panel 3 -->
  <g transform="rotate(-2 930 400)">
    <rect x="780" y="170" width="300" height="480" rx="14" fill="#fffce9" stroke="#fff2bb" stroke-width="4"/>
    <circle cx="930" cy="290" r="38" fill="#0f3c65"/>
    <rect x="885" y="340" width="90" height="140" rx="44" fill="#4a9ccb"/>
    <rect x="905" y="480" width="22" height="100" rx="11" fill="#0f3c65"/>
