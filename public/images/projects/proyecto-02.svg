<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Imagen de ejemplo: lookbook de moda de verano">
  <rect width="1200" height="900" fill="#78c0e6"/>

  <!-- panel 1 -->
  <g transform="rotate(-3 270 400)">
    <rect x="120" y="150" width="300" height="520" rx="14" fill="#fffce9" stroke="#fff2bb" stroke-width="4"/>
    <circle cx="270" cy="270" r="40" fill="#0f3c65"/>
    <rect x="225" y="320" width="90" height="150" rx="44" fill="#4a9ccb"/>
    <rect x="245" y="470" width="22" height="120" rx="11" fill="#0f3c65"/>
