    <rect x="810" y="580" width="240" height="36" rx="18" fill="#ffac1e"/>
  </g>

  <text x="90" y="130" font-family="Arial, sans-serif" font-weight="bold" font-size="96" letter-spacing="4" fill="#0f3c65">LOOKBOOK</text>
  <text x="90" y="192" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="62" fill="#ffac1e">Verano</text>
  <text x="92" y="228" font-family="Arial, sans-serif" font-size="22" letter-spacing="8" fill="#0f3c65" opacity="0.8">EDITORIAL DE MODA</text>

  <text x="1140" y="850" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#0f3c65" text-anchor="end">IMG 02</text>
</svg>
