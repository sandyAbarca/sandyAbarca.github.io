<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Imagen de ejemplo: documental costero">
  <rect width="1200" height="900" fill="#0f3c65"/>

  <!-- claqueta -->
  <g>
    <rect x="100" y="110" width="270" height="200" rx="12" fill="#fff2bb" stroke="#0b2c4a" stroke-width="4"/>
    <g transform="skewX(-20)">
      <rect x="95" y="110" width="55" height="100" fill="#0f3c65"/>
      <rect x="175" y="110" width="55" height="100" fill="#0f3c65"/>
      <rect x="255" y="110" width="55" height="100" fill="#0f3c65"/>
    </g>
    <rect x="100" y="205" width="270" height="10" fill="#0b2c4a"/>
    <circle cx="150" cy="215" r="8" fill="#ffac1e"/>
    <circle cx="320" cy="215" r="8" fill="#ffac1e"/>
  </g>

  <!-- play -->
  <circle cx="760" cy="430" r="115" fill="#ffac1e"/>
  <path d="M725 370 L725 490 L845 430 Z" fill="#0f3c65"/>

  <!-- olas -->
  <path d="M0 720 Q200 690 400 720 T800 720 T1200 720 V900 H0 Z" fill="#4a9ccb" opacity="0.5"/>
  <path d="M0 762 Q200 732 400 762 T800 762 T1200 762 V900 H0 Z" fill="#78c0e6" opacity="0.45"/>

  <text x="110" y="600" font-family="Arial, sans-serif" font-weight="bold" font-size="100" letter-spacing="4" fill="#fff2bb">DOCUMENTAL</text>
  <text x="110" y="682" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="74" fill="#ffac1e">Costero</text>
  <text x="112" y="732" font-family="Arial, sans-serif" font-size="24" letter-spacing="8" fill="#78c0e6">4K · 24FPS · S-LOG3</text>

  <!-- badge REC -->
  <rect x="880" y="120" width="190" height="60" rx="30" fill="none" stroke="#fff2bb" stroke-width="3"/>
  <circle cx="930" cy="150" r="11" fill="#ffac1e"/>
  <text x="962" y="159" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#fff2bb">REC</text>

  <text x="1140" y="850" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#78c0e6" text-anchor="end">IMG 03</text>
</svg>
