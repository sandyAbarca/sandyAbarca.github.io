<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Imagen de ejemplo: ilustraciones botánicas">
  <rect width="1200" height="900" fill="#dce5d3"/>

  <!-- hojas -->
  <g transform="translate(180 240) rotate(-24)">
    <path d="M0 0 Q90 -70 200 0 Q90 70 0 0 Z" fill="#6b8e5a"/>
    <path d="M20 0 L185 0" stroke="#4c6b3f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(300 620) rotate(30)">
    <path d="M0 0 Q80 -60 180 0 Q80 60 0 0 Z" fill="#8faa72"/>
    <path d="M20 0 L160 0" stroke="#6b8e5a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(520 180) rotate(8)">
    <path d="M0 0 Q70 -50 160 0 Q70 50 0 0 Z" fill="#4c6b3f"/>
    <path d="M18 0 L142 0" stroke="#dce5d3" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- tallo -->
  <path d="M960 850 Q940 600 1000 420 Q1030 330 1100 250" fill="none" stroke="#4c6b3f" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(1100 250) rotate(-30)">
    <path d="M0 0 Q90 -70 200 0 Q90 70 0 0 Z" fill="#6b8e5a"/>
    <path d="M20 0 L185 0" stroke="#4c6b3f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(1040 390) rotate(-140)">
