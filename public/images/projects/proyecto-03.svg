    <path d="M18 0 L142 0" stroke="#6b8e5a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- puntos -->
  <g fill="#4c6b3f" opacity="0.5">
    <circle cx="430" cy="120" r="7"/>
    <circle cx="470" cy="150" r="5"/>
    <circle cx="750" cy="720" r="6"/>
    <circle cx="800" cy="750" r="4"/>
  </g>

  <text x="120" y="760" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="130" fill="#2f3e26">botánica</text>
  <text x="124" y="820" font-family="Arial, sans-serif" font-size="22" letter-spacing="8" fill="#4c6b3f">SERIE VECTORIAL · 2025</text>

  <text x="1140" y="60" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#4c6b3f" text-anchor="end">IMG 03</text>
</svg>
