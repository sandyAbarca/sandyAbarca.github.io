<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Imagen de ejemplo: fotografía de producto Café Norte">
  <rect width="1200" height="900" fill="#fff2bb"/>

  <!-- sombra -->
  <ellipse cx="600" cy="770" rx="300" ry="40" fill="#e6d183" opacity="0.6"/>

  <!-- bolsa de café -->
  <rect x="420" y="210" width="360" height="500" rx="30" fill="#0f3c65"/>
  <rect x="420" y="210" width="360" height="70" rx="28" fill="#0b2c4a"/>
  <circle cx="600" cy="430" r="110" fill="#ffac1e"/>
  <circle cx="600" cy="430" r="84" fill="#fffce9"/>
  <path d="M570 415 H630 V455 Q630 480 600 480 Q570 480 570 455 Z" fill="#0f3c65"/>
  <g stroke="#78c0e6" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M585 395 Q578 383 585 371"/>
    <path d="M615 395 Q608 383 615 371"/>
  </g>
  <text x="600" y="610" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="48" fill="#fff2bb" text-anchor="middle">Café Norte</text>
  <text x="600" y="652" font-family="Arial, sans-serif" font-size="16" letter-spacing="6" fill="#78c0e6" text-anchor="middle">GRANO DE ALTURA</text>

  <!-- taza -->
  <path d="M870 430 H970 V470 Q970 500 920 500 Q870 500 870 470 Z" fill="#ffac1e"/>
  <path d="M970 445 H1000 A26 26 0 0 1 970 485" fill="none" stroke="#ffac1e" stroke-width="12"/>
  <rect x="855" y="500" width="130" height="14" rx="7" fill="#0f3c65"/>
  <g stroke="#78c0e6" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M895 405 Q888 393 895 381"/>
    <path d="M935 405 Q928 393 935 381"/>
  </g>

  <!-- granos -->
  <g fill="#0b2c4a">
    <ellipse cx="170" cy="780" rx="22" ry="16" transform="rotate(-20 170 780)"/>
    <ellipse cx="215" cy="800" rx="20" ry="15" transform="rotate(15 215 800)"/>
    <ellipse cx="150" cy="815" rx="18" ry="14" transform="rotate(40 150 815)"/>
  </g>
  <g stroke="#fff2bb" stroke-width="3" fill="none">
    <path d="M160 775 Q170 782 180 775"/>
    <path d="M205 795 Q215 802 225 795"/>
    <path d="M142 810 Q150 817 158 810"/>
  </g>

  <!-- esquinas de visor -->
  <g stroke="#ffac1e" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M60 104 V 60 H 104"/>
    <path d="M1096 60 H 1140 V 104"/>
    <path d="M60 796 V 840 H 104"/>
    <path d="M1096 840 H 1140 V 796"/>
