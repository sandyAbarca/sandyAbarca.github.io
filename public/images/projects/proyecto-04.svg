  <text x="90" y="115" font-family="Arial, sans-serif" font-weight="bold" font-size="26" letter-spacing="6" fill="#0f3c65">FOTOGRAFÍA DE PRODUCTO</text>
  <text x="92" y="146" font-family="Arial, sans-serif" font-size="18" letter-spacing="8" fill="#e8930a">COMERCIAL</text>

  <text x="1140" y="850" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#0f3c65" text-anchor="end">IMG 04</text>
