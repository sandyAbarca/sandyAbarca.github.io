<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Imagen de ejemplo: cartel Festival K’awil">
  <rect width="1200" height="900" fill="#0f3c65"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#fff2bb" stroke-width="3"/>

  <!-- sol central -->
  <g transform="translate(330 350)">
    <g stroke="#ffac1e" stroke-width="20" stroke-linecap="round">
      <path d="M0 -230 V -280"/>
      <path d="M0 230 V 280"/>
      <path d="M-230 0 H -280"/>
      <path d="M230 0 H 280"/>
      <path d="M-163 -163 L -198 -198"/>
      <path d="M163 163 L 198 198"/>
      <path d="M163 -163 L 198 -198"/>
      <path d="M-163 163 L -198 198"/>
    </g>
    <circle r="150" fill="#ffac1e"/>
    <circle r="100" fill="#0f3c65"/>
    <circle r="52" fill="#fff2bb"/>
  </g>

  <!-- tipografía de cartel -->
  <text x="640" y="300" font-family="Arial, sans-serif" font-weight="bold" font-size="120" letter-spacing="6" fill="#fff2bb">FESTIVAL</text>
  <text x="640" y="410" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="110" fill="#ffac1e">K’awil</text>
  <text x="642" y="470" font-family="Arial, sans-serif" font-size="26" letter-spacing="12" fill="#78c0e6">ARTE · MÚSICA · CULTURA</text>
  <rect x="642" y="500" width="200" height="8" fill="#ffac1e"/>
  <text x="642" y="590" font-family="Arial, sans-serif" font-weight="bold" font-size="46" letter-spacing="4" fill="#fff2bb">10 · 11 · 12 ABRIL</text>
  <text x="642" y="650" font-family="Arial, sans-serif" font-size="24" letter-spacing="6" fill="#78c0e6">ENTRADA LIBRE — PLAZA CENTRAL</text>

  <!-- confeti -->
  <g>
    <circle cx="850" cy="120" r="12" fill="#ffac1e"/>
    <circle cx="950" cy="700" r="10" fill="#ffac1e"/>
    <circle cx="1050" cy="130" r="8" fill="#fff2bb"/>
    <circle cx="1100" cy="420" r="9" fill="#78c0e6"/>
    <rect x="880" y="600" width="16" height="16" fill="#78c0e6" transform="rotate(20 888 608)"/>
    <rect x="1020" y="740" width="14" height="14" fill="#fff2bb" transform="rotate(45 1027 747)"/>
  </g>

  <text x="1140" y="810" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#78c0e6" text-anchor="end">IMG 06</text>
</svg>
