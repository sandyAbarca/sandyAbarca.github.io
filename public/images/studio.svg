<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Ilustración de ejemplo del estudio de diseño">
  <rect width="900" height="700" rx="16" fill="#fff2bb"/>

  <!-- marco punteado -->
  <rect x="28" y="28" width="844" height="644" rx="12" fill="none" stroke="#e6d183" stroke-width="2" stroke-dasharray="3 8"/>

  <!-- texto -->
  <text x="70" y="105" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="46" fill="#0f3c65">el estudio ✳</text>
  <text x="72" y="138" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#5b7a99">IMAGEN DE EJEMPLO</text>

  <!-- lámpara -->
  <path d="M640 300 L640 470" stroke="#0f3c65" stroke-width="10" stroke-linecap="round"/>
  <path d="M580 470 H700" stroke="#0f3c65" stroke-width="10" stroke-linecap="round"/>
  <path d="M612 320 A58 58 0 0 1 668 320 Z" fill="#ffac1e"/>

  <!-- laptop -->
  <rect x="300" y="330" width="230" height="145" rx="10" fill="#0f3c65"/>
  <rect x="312" y="342" width="206" height="121" rx="4" fill="#78c0e6"/>
  <text x="415" y="420" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="56" fill="#0f3c65" text-anchor="middle">Aa</text>
  <path d="M255 478 L415 478 L395 505 L435 505 Z" fill="#0f3c65"/>
  <path d="M300 490 L530 490 L560 515 L270 515 Z" fill="#0f3c65"/>

  <!-- escritorio -->
  <rect x="120" y="516" width="660" height="18" rx="9" fill="#0f3c65"/>
  <rect x="180" y="534" width="18" height="110" rx="6" fill="#1d4e7c"/>
  <rect x="700" y="534" width="18" height="110" rx="6" fill="#1d4e7c"/>

  <!-- muestras de color -->
  <circle cx="170" cy="470" r="26" fill="#ffac1e"/>
  <circle cx="240" cy="470" r="26" fill="#78c0e6"/>
  <circle cx="580" cy="430" r="20" fill="#0f3c65"/>
  <circle cx="632" cy="430" r="20" fill="#fffce9" stroke="#e6d183" stroke-width="3"/>
  <circle cx="684" cy="430" r="20" fill="#e9b98e"/>

  <!-- jarra de lápices -->
  <rect x="660" y="330" width="66" height="90" rx="8" fill="#0f3c65"/>
  <rect x="676" y="252" width="10" height="80" rx="4" fill="#ffac1e"/>
  <rect x="694" y="262" width="10" height="70" rx="4" fill="#78c0e6"/>
  <rect x="712" y="272" width="10" height="60" rx="4" fill="#e8930a"/>

  <!-- papel con garabato -->
  <rect x="80" y="330" width="150" height="130" rx="8" fill="#fffce9" stroke="#e6d183" stroke-width="2" transform="rotate(-6 155 395)"/>
  <path d="M120 370 Q155 330 190 390 T215 420" fill="none" stroke="#e8930a" stroke-width="5" stroke-linecap="round" transform="rotate(-6 155 395)"/>
</svg>
