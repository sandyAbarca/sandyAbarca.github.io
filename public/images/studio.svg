<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Ilustración de ejemplo del set fotográfico de Sandy">
  <rect width="900" height="700" rx="16" fill="#fff2bb"/>

  <!-- marco punteado -->
  <rect x="28" y="28" width="844" height="644" rx="12" fill="none" stroke="#e6d183" stroke-width="2" stroke-dasharray="3 8"/>

  <!-- texto -->
  <text x="70" y="105" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="46" fill="#0f3c65">el set ✳</text>
  <text x="72" y="138" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#5b7a99">IMAGEN DE EJEMPLO</text>

  <!-- backdrop playero -->
  <rect x="70" y="170" width="280" height="280" rx="14" fill="#78c0e6"/>
  <circle cx="210" cy="240" r="46" fill="#ffac1e"/>
  <g stroke="#ffac1e" stroke-width="7" stroke-linecap="round">
    <path d="M210 165 V 150"/>
    <path d="M210 315 V 330"/>
    <path d="M135 240 H 120"/>
    <path d="M285 240 H 300"/>
  </g>
  <path d="M70 400 Q140 385 210 400 Q280 415 350 395 L350 450 L70 450 Z" fill="#0f3c65" opacity="0.4"/>

  <!-- trípode y cámara -->
  <g stroke="#0f3c65" stroke-width="9" stroke-linecap="round">
    <path d="M520 508 L474 642"/>
    <path d="M520 508 L566 642"/>
    <path d="M520 508 L520 650"/>
    <path d="M492 578 L548 578" stroke-width="6"/>
  </g>
  <rect x="466" y="412" width="108" height="78" rx="12" fill="#0f3c65"/>
  <circle cx="520" cy="451" r="30" fill="#ffac1e"/>
  <circle cx="520" cy="451" r="19" fill="#0b2c4a"/>
  <circle cx="509" cy="441" r="7" fill="#fff2bb" opacity="0.85"/>
  <rect x="490" y="398" width="60" height="20" rx="8" fill="#0f3c65"/>

  <!-- softbox -->
  <path d="M210 560 V 640" stroke="#0f3c65" stroke-width="8" stroke-linecap="round"/>
  <rect x="190" y="636" width="40" height="8" rx="4" fill="#0f3c65"/>
  <rect x="115" y="420" width="190" height="140" rx="14" fill="#0f3c65"/>
  <rect x="135" y="440" width="150" height="100" rx="10" fill="#fffce9"/>

  <!-- reflector -->
  <circle cx="735" cy="290" r="64" fill="#fffce9" stroke="#ffac1e" stroke-width="10"/>
  <path d="M735 354 V 396" stroke="#0f3c65" stroke-width="8" stroke-linecap="round"/>

  <!-- piso -->
  <rect x="60" y="636" width="780" height="8" rx="4" fill="#f7e3a3"/>

  <!-- tira de película -->
  <rect x="90" y="668" width="720" height="44" rx="10" fill="#0b2c4a"/>
  <g fill="#fff2bb">
    <circle cx="120" cy="690" r="9"/>
    <circle cx="212" cy="690" r="9"/>
    <circle cx="304" cy="690" r="9"/>
    <circle cx="396" cy="690" r="9"/>
    <circle cx="488" cy="690" r="9"/>
    <circle cx="580" cy="690" r="9"/>
    <circle cx="672" cy="690" r="9"/>
    <circle cx="764" cy="690" r="9"/>
  </g>
</svg>
